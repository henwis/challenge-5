name: CI

on:
  pull_request:
    types: [opened, synchronize, edited]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build  

      - name: Collect build diagnostics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p diagnostics
          {
            echo "=== Build Diagnostics Report ==="
            echo "Timestamp: $(date -u)"
            echo "Runner OS: $RUNNER_OS"
            echo "Node: $(node --version)"
            echo ""
            echo "=== Environment ==="
            printenv | sort
          } > diagnostics/report.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: diagnostics/
          retention-days: 1

      - name: Fetch deploy token
        id: fetch-token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOKEN=$(docker run --rm ghcr.io/${{ github.repository_owner }}/challenge-env-5:latest printenv WORKSHOP_TOKEN)
          echo "deploy_token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Build
        env:
          DEPLOY_TOKEN: ${{ steps.fetch-token.outputs.deploy_token }}
        run: |
          npm run build
          echo "DEPLOY_TOKEN=${DEPLOY_TOKEN}" >> build.log